# Novel contribution: Multi-Objective Verifiable Reward (MOVR / Fin-RLVR)
algorithm: dapo_movr
model: MlpPolicy
env: env_movr

epsilon_low: 0.2
epsilon_high: 0.28
dynamic_sampling: true

total_epochs: 100
steps_per_epoch: 20000
learning_rate: 3.0e-4
gamma: 0.99
train_pi_iters: 80
train_v_iters: 80
target_kl: 0.01

# MUST match paper's evaluation period exactly for valid comparison
train_start: "2013-01-01"
train_end:   "2018-12-31"
test_start:  "2019-01-01"
test_end:    "2023-12-31"
initial_capital: 1000000
sharpe_window: 20

sweep_configs:
  - name: acc_only
    movr_alpha: 1.0
    movr_beta:  0.0
    movr_gamma: 0.0
    description: "Accuracy signal only — equivalent to binary DeepStock reward"

  - name: sharpe_only
    movr_alpha: 0.0
    movr_beta:  1.0
    movr_gamma: 0.0
    description: "Delta-Sharpe only — pure risk-adjusted signal"

  - name: mdd_only
    movr_alpha: 0.0
    movr_beta:  0.0
    movr_gamma: 1.0
    description: "Drawdown penalty only — conservative capital preservation"

  - name: balanced
    movr_alpha: 1.0
    movr_beta:  0.5
    movr_gamma: 0.3
    description: "Balanced MOVR — primary proposed configuration"

  - name: sentiment_heavy
    movr_alpha: 2.0
    movr_beta:  0.5
    movr_gamma: 0.2
    description: "Higher accuracy weight — mirrors paper alpha=3 emphasis"
