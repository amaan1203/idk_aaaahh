# Fast A100 configuration (1-hour target)
# ---------------------------------------
algorithm: dapo_movr
model: MlpPolicy
env: env_movr

epsilon_low: 0.2
epsilon_high: 0.28
dynamic_sampling: true

# REDUCED for 1-hour A100 window (standard was 100)
total_epochs: 50
steps_per_epoch: 20000
learning_rate: 3.0e-4
gamma: 0.99
train_pi_iters: 80
train_v_iters: 80
target_kl: 0.01

train_start: "2013-01-01"
train_end:   "2018-12-31"
test_start:  "2019-01-01"
test_end:    "2023-12-31"
initial_capital: 1000000
sharpe_window: 20

# Focused sweep: Only the 3 most critical configurations
sweep_configs:
  - name: balanced
    movr_alpha: 1.0
    movr_beta:  0.5
    movr_gamma: 0.3
    description: "Primary balanced config"

  - name: sharpe_only
    movr_alpha: 0.0
    movr_beta:  1.0
    movr_gamma: 0.0
    description: "Risk-only baseline"

  - name: sentiment_heavy
    movr_alpha: 2.0
    movr_beta:  0.5
    movr_gamma: 0.2
    description: "High alpha emphasis"
